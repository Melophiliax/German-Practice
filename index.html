<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch Trainer A1–B1</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1c1c1c;--mute:#6b6b6b;--line:#dcd8cf;--acc:#1f4e79;--acc2:#e8eef5;--ok:#2e7d32;--bad:#c62828;--okbg:#e6f4e7;--badbg:#fbe9e9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181c;--card:#1e2328;--ink:#ececec;--mute:#9aa0a6;--line:#333a41;--acc:#8fb8e0;--acc2:#27323d;--ok:#7bc67e;--bad:#ef8a8a;--okbg:#1d3320;--badbg:#3a2022}}
:root[data-theme=dark]{--bg:#15181c;--card:#1e2328;--ink:#ececec;--mute:#9aa0a6;--line:#333a41;--acc:#8fb8e0;--acc2:#27323d;--ok:#7bc67e;--bad:#ef8a8a;--okbg:#1d3320;--badbg:#3a2022}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto;padding:12px 16px}
header a{font:700 18px system-ui,sans-serif;color:var(--acc);cursor:pointer;text-decoration:none}
main{max-width:680px;margin:0 auto;padding:0 16px 40px}
h1,h2,h3,h4,button,input,textarea,.tag,small{font-family:system-ui,sans-serif}
h1{font-size:28px;margin:8px 0 16px}h2{font-size:21px;margin:14px 0}h3{margin:22px 0 8px;display:flex;justify-content:space-between}
h4{font-size:14px;color:var(--mute);margin:14px 0 2px;font-weight:600}@keyframes f{from{opacity:0}to{opacity:1}}.pic{display:flex;justify-content:center;align-items:center;min-height:170px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin:10px 0 2px;overflow:hidden}.pic .emoji{font-size:96px;line-height:1.1}.pic img{max-width:100%;max-height:240px;object-fit:contain;animation:f .3s}.pic.ph .emoji{display:none}.attr{font:12px system-ui;color:var(--mute);text-align:center;min-height:16px;margin-bottom:6px}.attr a{color:var(--acc)}textarea{resize:vertical;font-family:Georgia,serif}small{color:var(--mute);font-weight:400}
button,input,textarea{font-size:17px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:13px 14px;width:100%;margin:5px 0;text-align:left;min-height:48px}
button{cursor:pointer;font-weight:600}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}
.topic{display:flex;justify-content:space-between;align-items:center}
.big,.go{background:var(--acc);color:var(--bg);border-color:var(--acc);text-align:center}
.sec{background:var(--acc2);text-align:center}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tag{font-size:13px;color:var(--mute)}
blockquote{margin:10px 0;padding:12px 14px;background:var(--card);border-left:4px solid var(--acc);border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:1.5px dashed var(--line);border-radius:10px;margin:6px 0}
.chips b{font:600 17px system-ui,sans-serif;background:var(--acc2);padding:10px 14px;border-radius:8px;cursor:pointer}
#fb{margin:10px 0;padding:12px;border-radius:10px;font-family:system-ui,sans-serif}#fb:empty{display:none}
#fb.ok{background:var(--okbg);color:var(--ok)}#fb.bad{background:var(--badbg);color:var(--bad)}#fb p{margin:6px 0 0;color:var(--ink)}
@media(min-width:700px){body{font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}}
</style>
</head>
<body>
<header><a onclick="home()">🇩🇪 Deutsch Trainer</a><span><button style="width:auto;min-height:40px;display:inline-block" onclick="settings()" aria-label="Einstellungen">⚙</button> <button style="width:auto;min-height:40px;display:inline-block" onclick="theme()" aria-label="Theme">◐</button></span></header>
<main id="app">Lädt…</main>
<script src="app.js"></script>
<script src="ai.js"></script>
<script src="flash.js"></script>
</body>
</html>
